[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "UP042",  # Allow (str, enum.Enum) for Python 3.10 compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
